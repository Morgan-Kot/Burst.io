<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Popmania.io</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 95vw;
            height: 90vh;
            max-width: 800px;
            background-color: #111;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        .hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 5;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 20px;
            margin-bottom: 5px;
            color: #f1c40f;
        }

        h3 {
            font-size: 16px;
            margin-bottom: 25px;
            color: #bdc3c7;
            font-weight: normal;
        }

        p {
            font-size: 16px;
            margin-bottom: 12px;
            color: #ecf0f1;
            text-align: center;
        }

        button {
            font-size: 16px;
            background-color: #34495e;
            color: #ecf0f1;
            border: none;
            padding: 12px 20px;
            margin: 8px 0;
            width: 220px;
            cursor: pointer;
        }

        button:active {
            background-color: #415b76;
        }

        #game-over-screen {
            background-color: #c0392b;
        }

        #game-over-screen button {
            background-color: #e74c3c;
        }

        .bottom-buttons {
            position: absolute;
            bottom: 30px;
            display: flex;
            flex-direction: column;
        }

        /* Shop Grid UI Styles */
        .shop-list {
            width: 90%;
            max-height: 65%;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 10px;
            margin-bottom: 15px;
        }

        .shop-item {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            background: #232d3b;
            padding: 20px 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .shop-item.equipped {
            /* No ugly border, keeping it clean like the design */
        }

        .shop-item img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .shop-circle-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #fff;
            margin-bottom: 15px;
        }

        .shop-meta {
            display: none;
            /* Removed names to perfectly match your visual tile mockup */
        }

        .shop-btn {
            width: 100%;
            padding: 10px 0;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <div id="hud" class="hud hidden">
            <span id="hud-score">Score: 0</span>
            <span id="hud-timer" style="color: #e74c3c;">Time: 2.5s</span>
            <span id="hud-popcoins" style="color: #f1c40f;">Popcoins: 0</span>
            <span id="hud-level">Lvl: 1</span>
        </div>

        <canvas id="game-canvas"></canvas>

        <div id="menu-screen" class="screen">
            <h1>POPMANIA.IO</h1>
            <h2 id="high-score-display">High Score: 0</h2>
            <h3 id="last-score-display">Last Score: 0</h3>
            <button onclick="startGame('normal')">PLAY</button>
            <button onclick="showScreen('gamemodes-screen')">GAMEMODES</button>
            <button onclick="showScreen('shop-screen')">POP-SHOP</button>
            <button onclick="showScreen('settings-screen')">SETTINGS</button>
        </div>

        <div id="gamemodes-screen" class="screen hidden">
            <h1>GAMEMODES</h1>
            <button onclick="startGame('normal')" style="background-color: #2980b9;">NORMAL</button>
            <button onclick="startGame('chaos')" style="background-color: #8e44ad;">CHAOS</button>
            <button onclick="showScreen('menu-screen')"
                style="background-color: #7f8c8d; margin-top: 30px;">BACK</button>
        </div>

        <div id="shop-screen" class="screen hidden">
            <h1>POP-SHOP</h1>
            <h2 id="shop-balance" style="margin-bottom: 15px;">Popcoins: 0</h2>
            <div class="shop-list" id="shop-items-container"></div>
            <button onclick="showScreen('menu-screen')" style="background-color: #7f8c8d;">BACK</button>
        </div>

        <div id="settings-screen" class="screen hidden">
            <h1>SETTINGS</h1>
            <button id="btn-audio" onclick="toggleAudio()" style="background-color: #2980b9;">AUDIO: ON</button>
            <button id="btn-haptic" onclick="toggleHaptics()" style="background-color: #2980b9;">VIBRATION: ON</button>
            <button onclick="showScreen('menu-screen')"
                style="background-color: #7f8c8d; margin-top: 30px;">BACK</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p id="final-score" style="font-size: 20px; margin-bottom: 10px;">Final Score: 0</p>
            <p id="final-level" style="font-size: 16px; margin-bottom: 30px;">Level Reached: 1</p>
            <div class="bottom-buttons">
                <button onclick="startGame(state.currentMode)">RETRY</button>
                <button onclick="showScreen('menu-screen')">MENU</button>
            </div>
        </div>
    </div>

    <script src="js/variables.js"></script>
    <script src="js/modes/chaos.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/game.js"></script>
    <script src="js/skins.js"></script>
</body>

</html>
