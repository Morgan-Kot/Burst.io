<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Burst.io</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div id="menu-screen" class="screen active">
            <h1>BURST.IO</h1>
            <button id="btn-start">START</button>
            <button id="btn-settings">SETTINGS</button>
        </div>

        <div id="gamemode-screen" class="screen">
            <h2>GAMEMODE SELECTION</h2>
            <div class="gamemode-grid">
                <button id="btn-play-normal" class="full-width">PLAY</button>
                <button id="btn-play-custom" class="half-width">CUSTOM</button>
                <button id="btn-play-hardcore" class="half-width">HARDCORE</button>
            </div>
        </div>

        <div id="sandbox-screen" class="screen">
            <h2>SANDBOX MODE</h2>
            <div class="toggle-container">
                <div class="toggle-row">
                    <span>BOMBS</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-bombs" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span>2X SIZE</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-size" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span>2X TIME</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-time">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-row">
                    <span>HARDCORE</span>
                    <label class="switch">
                        <input type="checkbox" id="toggle-hardcore">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <button id="btn-save-play">SAVE & PLAY</button>
        </div>

        <div id="game-over-screen" class="screen">
            <h2>GAME OVER</h2>
            <p>SCORE: <span id="final-score">0</span></p>
            <button id="btn-retry" class="bottom-btn">RETRY</button>
            <button id="btn-menu" class="bottom-btn">MENU</button>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>
    <script src="game.js"></script>
</body>
</html>
