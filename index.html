<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home</title>
    <style>
        /* Base text styling */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Basic list cleanup */
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 15px;
        }

        /* Making the a-tag look like a basic button */
        .atag {
            display: inline-block;
            background-color: #f0f0f0;
            color: #000000;
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #cccccc;
            border-radius: 4px;
        }

        .imp {
            display: inline-block;
            background-color: #0BA3FF;
            color: #000000;
            padding: 8px 16px;
            text-decoration: none;
            border: 1px solid #cccccc;
            border-radius: 4px;

        /* Simple hover effect */
        .atag:hover {
            background-color: #e0e0e0;
            border-color: #adadad;
        }

        /* Simple line separator adjustment */
        hr {
            border: 0;
            border-top: 1px solid #ccc;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <h2>Choose version:</h2>

    <ul>
        <li>
            <a href="game.html" class="atag imp">Play latest</a>
        </li>
        
        <hr>
        
        <li>
            <a href="versions/o1_burst.html" class="atag">Version 1</a>
        </li>
    </ul>

</body>
</html>
